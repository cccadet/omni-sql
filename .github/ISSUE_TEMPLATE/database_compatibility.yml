name: Database compatibility report
description: Share a successful connection or a database-specific compatibility problem.
title: "[Compatibility]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports help us verify real database versions and configurations. Never include passwords, connection strings, hostnames, or production data.
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQL Server
        - Oracle
        - Generic JDBC
    validations:
      required: true
  - type: input
    id: database-version
    attributes:
      label: Database version
      placeholder: "For example: Oracle Database 23ai Free"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result type
      options:
        - Successful compatibility report
        - Connection problem
        - Metadata or autocomplete problem
        - Query execution problem
        - Editing or execution-plan problem
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What did you test?
      description: Include the workflow, result, and any relevant database configuration without exposing private infrastructure.
    validations:
      required: true
  - type: input
    id: omni-version
    attributes:
      label: omni-sql version
      placeholder: "For example: 0.2.5"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Debian/Ubuntu Linux
        - Other Linux
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, connection strings, hostnames, and sensitive data.
          required: true
