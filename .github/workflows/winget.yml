name: WinGet Defender diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable Defender for isolated diagnosis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection'
          if (Test-Path $policy) {
            Set-ItemProperty $policy -Name ForceDefenderPassiveMode -Value 0 -Type DWord
          }
          Start-Service WinDefend
          Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -DisableScriptScanning $false -DisableArchiveScanning $false -DisableBlockAtFirstSeen $false -PUAProtection Enabled -MAPSReporting Advanced -ScanAvgCPULoadFactor 50
          $preferences = Get-MpPreference
          if ($preferences.ExclusionPath) { Remove-MpPreference -ExclusionPath $preferences.ExclusionPath }
          if ($preferences.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $preferences.ExclusionProcess }
          if ($preferences.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $preferences.ExclusionExtension }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $status | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal') {
            throw 'Defender is not active; this runner cannot reproduce the scan'
          }
      - name: Download and verify published installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'winget-diagnostics'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $installer = Join-Path $destination 'omni-sql_0.5.4_x64-setup.exe'
          Invoke-WebRequest 'https://github.com/cccadet/omni-sql/releases/download/v0.5.4/omni-sql_0.5.4_x64-setup.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '3F88BB1D8C559697C14D13164CFE32C977A2468B0DA5F34B08DB34DF3CA471D1') {
            throw 'Published installer checksum mismatch'
          }
          Get-AuthenticodeSignature $installer | Select-Object Path, Status, StatusMessage | Format-List
      - name: Scan published installer with Defender
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'winget-diagnostics'
          $installer = Join-Path $destination 'omni-sql_0.5.4_x64-setup.exe'
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $scanner) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $process = Start-Process $scanner -ArgumentList @('-Scan', '-ScanType', '3', '-File', "`"$installer`"") -PassThru -RedirectStandardOutput (Join-Path $destination 'installer-scan.log') -RedirectStandardError (Join-Path $destination 'installer-scan-error.log')
          if (-not $process.WaitForExit(300000)) {
            try { $process.Kill($true) } catch { Write-Warning $_ }
            throw 'Installer scan did not finish within five minutes'
          }
          Get-Content (Join-Path $destination 'installer-scan.log')
          if ($process.ExitCode -ne 0) { throw "Installer scan returned $($process.ExitCode)" }
          if (Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($installer) }) {
            throw 'Defender detected a threat in the installer; see diagnostics'
          }
      - name: Install published NSIS package
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'winget-diagnostics\omni-sql_0.5.4_x64-setup.exe'
          $process = Start-Process $installer -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(120000)) {
            Get-Process | Where-Object MainWindowTitle | Select-Object ProcessName, Id, MainWindowTitle | Format-List
            try { $process.Kill($true) } catch { Write-Warning $_ }
            throw 'Silent installation did not finish within two minutes'
          }
          if ($process.ExitCode -ne 0) { throw "Installation returned $($process.ExitCode)" }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\omni-sql'
          $entry | Select-Object DisplayName, DisplayVersion, Publisher | Format-List
          if ($entry.DisplayVersion -ne '0.5.4') { throw 'Expected version is not installed' }
      - name: Scan installed application with Defender
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'winget-diagnostics'
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\omni-sql'
          $executable = $entry.DisplayIcon.Trim('"')
          $scanRoot = Split-Path $executable
          Get-AuthenticodeSignature $executable | Select-Object Path, Status, StatusMessage | Format-List
          $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $scanner) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $process = Start-Process $scanner -ArgumentList @('-Scan', '-ScanType', '3', '-File', "`"$scanRoot`"") -PassThru -RedirectStandardOutput (Join-Path $destination 'application-scan.log') -RedirectStandardError (Join-Path $destination 'application-scan-error.log')
          if (-not $process.WaitForExit(300000)) {
            try { $process.Kill($true) } catch { Write-Warning $_ }
            throw 'Application scan did not finish within five minutes'
          }
          Get-Content (Join-Path $destination 'application-scan.log')
          if ($process.ExitCode -ne 0) { throw "Application scan returned $($process.ExitCode)" }
          if (Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($scanRoot) }) {
            throw 'Defender detected a threat in the application; see diagnostics'
          }
      - name: Collect Defender diagnostics
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'winget-diagnostics'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $report = @{
            Status = Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated
            Threats = @(Get-MpThreat | Select-Object ThreatID, ThreatName, IsActive, DidThreatExecute)
            Detections = @(Get-MpThreatDetection | Select-Object ThreatID, Resources, ActionSuccess, InitialDetectionTime)
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $destination 'defender.json')
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1000,1001,1002,1116,1117} -MaxEvents 50 -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, Message | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $destination 'defender-events.json')
      - name: Upload Defender diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-defender-diagnostics
          path: ${{ runner.temp }}/winget-diagnostics
          retention-days: 7
