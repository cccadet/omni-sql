name: Windows x64 preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows runtime cleanup
        shell: powershell
        run: ./scripts/stop-runtime.test.ps1

      - name: Prepare resources
        run: pnpm prepare:resources

      - name: Validate resources
        run: pnpm validate:resources

      - name: Build Tauri NSIS installer
        run: pnpm --filter desktop exec tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify NSIS executable and silent WinGet uninstallation
        timeout-minutes: 5
        shell: pwsh
        run: |
          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $productName = [string]$config.productName
          $version = [string]$config.version
          $nsisDir = Join-Path $PWD "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"

          if (-not (Test-Path $nsisDir)) {
            throw "NSIS bundle directory was not generated: $nsisDir"
          }

          $expectedName = "{0}_{1}_x64-setup.exe" -f $productName, $version
          $installer = Get-ChildItem -LiteralPath $nsisDir -Filter "*.exe" -File |
            Where-Object { $_.Name -eq $expectedName }
          if ($null -eq $installer) {
            $found = (Get-ChildItem -LiteralPath $nsisDir -Filter "*.exe" -File | Select-Object -ExpandProperty Name) -join ", "
            throw "Expected $expectedName was not found in $nsisDir. Found: $found"
          }

          $fileVersion = [string]$installer.VersionInfo.FileVersion
          $binaryProductName = [string]$installer.VersionInfo.ProductName
          if ($binaryProductName -ne $productName) {
            throw "Installer ProductName '$binaryProductName' does not match '$productName'"
          }
          if (-not ($fileVersion -eq $version -or $fileVersion.StartsWith("$version."))) {
            throw "Installer FileVersion '$fileVersion' does not match '$version'"
          }

          "Installer: $($installer.FullName)"
          "ProductName: $binaryProductName"
          "FileVersion: $fileVersion"

          $ErrorActionPreference = 'Stop'
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          Repair-WinGetPackageManager -AllUsers
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet setup failed' }
          $process = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Silent installation failed' }
          $registry = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$productName"
          $entry = Get-ItemProperty $registry
          $expected = "$($entry.UninstallString) /S"
          if ($entry.DisplayVersion -ne $version -or $entry.QuietUninstallString -ne $expected) {
            throw 'Installer did not register the expected silent uninstall command'
          }
          $entry | Select-Object DisplayName, DisplayVersion, QuietUninstallString | Format-List
          winget uninstall --product-code $productName --silent --accept-source-agreements --disable-interactivity --verbose-logs
          if ($LASTEXITCODE -ne 0) { throw 'Silent WinGet uninstallation failed' }
          # NSIS starts a temporary copy so its original executable can be removed.
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path $registry); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if ((Test-Path $registry) -or (Test-Path $entry.DisplayIcon.Trim('"'))) {
            throw 'Uninstallation did not remove the package and executable'
          }

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis-${{ github.sha }}
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
