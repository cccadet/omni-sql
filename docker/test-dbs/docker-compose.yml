services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: omni_test
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
    ports:
      - "5432:5432"
    volumes:
      - ./init/01-postgres.sql:/docker-entrypoint-initdb.d/01-postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: omni_test
      MYSQL_USER: omni
      MYSQL_PASSWORD: omni
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./init/02-mysql.sql:/docker-entrypoint-initdb.d/02-mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Omni!2024"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./init/03-mssql.sql:/usr/config/init-script.sql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Omni!2024' -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - "-S"
      - "mssql"
      - "-U"
      - "sa"
      - "-P"
      - "Omni!2024"
      - "-C"
      - "-i"
      - "/usr/config/init-script.sql"
    volumes:
      - ./init/03-mssql.sql:/usr/config/init-script.sql:ro
    restart: "no"

  oracle:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: omni
      APP_USER: OMNI
      APP_USER_PASSWORD: omni
    ports:
      - "1521:1521"
    volumes:
      # gvenzl/oracle-xe executa seeds de primeira inicialização neste
      # diretório (e não em /opt/oracle/scripts/startup).
      - ./init/04-oracle.sql:/container-entrypoint-initdb.d/04-oracle.sql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Banco "JDBC custom": sem adaptador nativo no omni-sql, só alcançável via
  # jdbc-generic (options.jarPath + driverClassName). O jar do driver é
  # copiado pelo container para ./drivers (bind mount) — o sidecar JVM roda
  # no host e carrega esse arquivo. Ver jdbc-h2/Dockerfile.
  h2:
    build: ./jdbc-h2
    ports:
      - "9092:9092"
    volumes:
      - h2-data:/data
      - ./drivers:/drivers
    healthcheck:
      # Shell abre conexão JDBC real; o 1º acesso cria o banco (-ifNotExists).
      test: ["CMD-SHELL", "java -cp /opt/h2.jar org.h2.tools.Shell -url 'jdbc:h2:tcp://localhost:9092/./omni_test' -user omni -password omni -sql 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  h2-init:
    build: ./jdbc-h2
    depends_on:
      h2:
        condition: service_healthy
    entrypoint: ["java", "-cp", "/opt/h2.jar", "org.h2.tools.RunScript"]
    command:
      - "-url"
      - "jdbc:h2:tcp://h2:9092/./omni_test"
      - "-user"
      - "omni"
      - "-password"
      - "omni"
      - "-script"
      - "/init.sql"
    volumes:
      - ./init/05-h2.sql:/init.sql:ro
    restart: "no"

volumes:
  h2-data:
