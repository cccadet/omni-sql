sonar.projectKey=cccadet_omni-sql
sonar.organization=memory-mcp-server
sonar.projectName=omni-sql
sonar.sourceEncoding=UTF-8

# Analyze production code and keep test code in Sonar's dedicated test scope.
sonar.sources=apps/desktop/src,apps/desktop/src-tauri/src,packages,services/jvm-sidecar/src/main/kotlin
sonar.tests=apps/desktop/src,packages,services/jvm-sidecar/src/test/kotlin
sonar.inclusions=**/*.ts,**/*.tsx,**/*.rs,**/*.kt
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*Test.kt

# Dependencies, generated/build output, and local/infrastructure code are not
# application source and must not affect the SonarCloud project metrics.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.turbo/**,**/.cache/**,**/target/**,**/gen/**,**/*.rs.bk,**/*.test.ts,**/*.test.tsx,docker/**

# Coverage is generated by the SonarCloud CI job.
# JavaScript analysis runs in a Node subprocess; reserve sufficient heap for the
# monorepo so the scanner bridge cannot become unresponsive under CI load.
sonar.javascript.node.maxspace=4096

sonar.javascript.lcov.reportPaths=apps/desktop/coverage/lcov.info,packages/adapters-pg/coverage/lcov.info,packages/adapters-mysql/coverage/lcov.info,packages/adapters-mssql/coverage/lcov.info,packages/adapters-oracle/coverage/lcov.info,packages/adapters-jdbc/coverage/lcov.info,packages/autocomplete-engine/coverage/lcov.info,packages/dialect-descriptors/coverage/lcov.info,packages/metadata-cache/coverage/lcov.info,packages/backend/coverage/lcov.info,packages/mcp-server/coverage/lcov.info,packages/ts-types/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=services/jvm-sidecar/build/reports/jacoco/test/jacocoTestReport.xml
sonar.rust.lcov.reportPaths=apps/desktop/src-tauri/coverage/lcov.info
